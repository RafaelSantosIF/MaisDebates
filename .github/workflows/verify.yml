name: Verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx expo install --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: bash scripts/test-db.sh
